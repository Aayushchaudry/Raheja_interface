<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Responsive scaler: design is authored at 1920px. JS below zooms the
         root element so the 1920px layout fills any screen proportionally —
         smaller screens scale down, larger screens scale up. CSS always sees
         a ~1920px-wide viewport regardless of physical screen size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raheja Brand Wall Interface</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Proportional scaler — works at any screen size.
      // Resets zoom, measures the real viewport width, then applies a zoom
      // factor so the 1920px design fills the screen exactly.
      // --screen-h compensates for zoom affecting vh units.
      (function () {
        var DESIGN_W = 1920;
        function fit() {
          var html = document.documentElement;
          html.style.zoom = "";
          html.style.setProperty("--screen-h", "100vh");
          var w = html.clientWidth;
          var scale = w / DESIGN_W;
          if (Math.abs(scale - 1) > 0.02) {
            html.style.setProperty("--screen-h", window.innerHeight / scale + "px");
            html.style.zoom = scale;
          }
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
