<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Kiosk: lay the UI out at a fixed 1920-wide design and let the browser
         upscale it to fill the physical screen (~2x on a 4K 65" panel). Keeps
         every tuned size proportional and preserves vertical scrolling. -->
    <meta name="viewport" content="width=1920" />
    <title>Raheja Brand Wall Interface</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Kiosk scaler. The viewport meta locks a 1920-wide layout and most
      // TV / Android / commercial-display browsers upscale it to fill the
      // screen automatically. Desktop Chromium ignores the meta, so when we
      // detect a viewport wider than the design we zoom to fill instead, and
      // pin one-screen height (--screen-h) so full-height sections stay 1 screen.
      (function () {
        var DESIGN_W = 1920;
        function fit() {
          var html = document.documentElement;
          html.style.zoom = "";
          html.style.setProperty("--screen-h", "100vh");
          var w = html.clientWidth;
          if (w > DESIGN_W + 80) {
            var scale = w / DESIGN_W;
            html.style.setProperty("--screen-h", window.innerHeight / scale + "px");
            html.style.zoom = scale;
          }
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
