<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Responsive scaler: design is authored at 1920px. JS below zooms the
         root element so the 1920px layout fills any screen proportionally —
         smaller screens scale down, larger screens scale up. CSS always sees
         a ~1920px-wide viewport regardless of physical screen size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raheja Brand Wall Interface</title>

    <!-- Fonts load asynchronously so they never block first paint (they used to
         be chained @import statements in index.css, which delayed the whole UI
         from appearing on the kiosk). preconnect warms the connection; the
         media="print" + onload swap trick fetches the stylesheet without
         blocking render, then applies it once ready. A <noscript> fallback
         keeps fonts working if JS is disabled. display=swap (in each URL) shows
         text immediately in a fallback face and swaps when the web font loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Raleway:wght@200;300;400;500;600&family=Cinzel:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Raleway:wght@200;300;400;500;600&family=Cinzel:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Performance "lite" mode. The kiosk TV has a weak processor, so the
      // heavy *continuous* ambient animations (full-screen blurred beams,
      // film-grain blend layers, drifting dust/orbs) are switched off by
      // default — see `.perf-lite` in index.css. One-shot entrance reveals,
      // scroll-cue hints and the core hero stay. Append ?motion=full to the URL
      // to restore the full ambient motion. Runs before React mounts so the
      // class is present on first paint.
      if (!/[?&]motion=full\b/.test(window.location.search)) {
        document.documentElement.classList.add("perf-lite");
      }
    </script>
    <script>
      // Proportional scaler — works at any screen size.
      // Applies a zoom factor so the 1920px design fills the screen exactly.
      //
      // The scale is computed from window.innerWidth/innerHeight, which are NOT
      // affected by CSS `zoom`. That makes fit() a pure function of the real
      // viewport: it converges in one step and gives the identical result no
      // matter how many times it runs, so it can never drift.
      //
      // The previous version measured html.clientWidth (the element it zooms)
      // and back-calculated the device width from the active zoom. That assumes
      // the browser divides clientWidth by the root's own zoom — true in modern
      // Chrome, but FALSE in the older Chromium (53–87) of the webOS TV browser.
      // There the feedback never converged: every resize / fullscreen / standby
      // event multiplied the zoom by a factor < 1, so the layout shrank a little
      // each time ("contracts with time / contracts more on fullscreen").
      //
      // --screen-h is the screen height expressed in design (pre-zoom) pixels,
      // so CSS can use it in place of 100vh (vh ignores zoom).
      (function () {
        var DESIGN_W = 1920;
        var raf = 0;
        function fit() {
          raf = 0;
          var html = document.documentElement;
          var scale = window.innerWidth / DESIGN_W;
          html.style.setProperty("--screen-h", window.innerHeight / scale + "px");
          // Snap near-1 scales to no-zoom so a true 1920 panel pays nothing.
          html.style.zoom = Math.abs(scale - 1) > 0.02 ? scale : "";
        }
        // Coalesce event bursts (fullscreen fires many resizes) into one relayout
        // per frame — `zoom` triggers a full reflow, costly on the weak TV CPU.
        function schedule() {
          if (!raf) raf = window.requestAnimationFrame(fit);
        }
        fit();
        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", schedule);
        // Re-fit when TV wakes from standby — resolution can change on resume.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") schedule();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
